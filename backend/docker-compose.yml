services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coupon_platform
      POSTGRES_PASSWORD: coupon_platform
      POSTGRES_DB: coupon_platform
    ports:
      # Host port 5433, not 5432 — this machine already runs a native
      # Postgres service on 5432; mapping there would silently connect to
      # the wrong database instead of this container.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
